name: Router smoke tests

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Python syntax check
        run: >-
          python -m py_compile
          router.py

      - name: Shell syntax check
        run: |
          bash -n install.sh
          bash -n get.sh
          bash -n hermes-router
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Run router smoke tests
        env:
          PROXY_API_KEYS: sk-test
          ROUTER_AUTH_FILE: ${{ runner.temp }}/auth.json
          ROUTER_STATE_FILE: ${{ runner.temp }}/router_state.json
          CACHE_DB_PATH: ${{ runner.temp }}/cache.db
          CACHE_PERSIST: "0"
          AUTO_DISCOVER_MODELS: "0"
          LOG_LEVEL: WARNING
        run: python -m pytest -q
