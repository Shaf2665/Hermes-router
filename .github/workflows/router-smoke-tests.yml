name: Router smoke tests

on:
  push:
    branches:
      - main
      - "agent/**"
      - "codex/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest playwright
          python -m playwright install --with-deps chromium

      - name: Python syntax check
        run: >-
          python -m py_compile
          router.py
          usage_store.py
          context_policy.py
          responses_api.py
          plugins/hermes-router/scripts/hermes_bridge.py

      - name: Shell syntax check
        shell: bash
        run: |
          bash -n install.sh
          bash -n get.sh
          bash -n hermes-router
          find scripts -name "*.sh" -print0 | xargs -0 -n1 bash -n

      - name: Run router smoke tests
        env:
          PROXY_API_KEYS: sk-test
          ROUTER_AUTH_FILE: ${{ runner.temp }}/auth.json
          ROUTER_STATE_FILE: ${{ runner.temp }}/router_state.json
          CACHE_DB_PATH: ${{ runner.temp }}/cache.db
          CACHE_PERSIST: "0"
          AUTO_DISCOVER_MODELS: "0"
          LOG_LEVEL: WARNING
        run: python -m pytest -q

  extension:
    name: Extension typecheck and sync tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run compile

  cli-compatibility:
    name: Coding CLI bridge compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt pytest
      - run: npm install -g @openai/codex@0.167.0-alpha.4 @anthropic-ai/claude-code@2.1.318
      - name: Verify native coding CLIs and saved-session resume against local stubs
        env:
          HERMES_RUN_CODEX_SMOKE: '1'
          HERMES_RUN_CLAUDE_SMOKE: '1'
        run: python -m pytest -q tests/test_codex_cli_bridge.py tests/test_claude_cli_bridge.py
