services:
  hermes-router:
    build: .
    ports:
      - "127.0.0.1:${PORT:-8319}:8319"
    environment:
      HOST: 0.0.0.0
      PORT: 8319
    volumes:
      - hermes-data:/app/data
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim ships without curl/wget — probe with the stdlib instead
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(f\"http://localhost:{os.environ.get('PORT','8319')}/health\")"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  hermes-data:
